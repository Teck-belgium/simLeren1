<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>3D Glider Simulator - Teck</title>
<style>
  body { margin:0; overflow:hidden; background:#0d1b2a; }
  #hud {
    position:absolute;
    top:12px;
    left:12px;
    color:white;
    font-family:Arial;
    font-size:16px;
    background:rgba(0,0,0,0.5);
    padding:8px 10px;
    border-radius:6px;
  }
</style>
</head>
<body>
<div id="hud">Snelheid: 0 km/u<br>Hoogte: 0 m</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.min.js"></script>
<script>

// -------------------- Scene & Camera --------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1b2a);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,5,10);

// Renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// -------------------- Lights --------------------
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5,10,5);
scene.add(dirLight);

const ambient = new THREE.AmbientLight(0x404040, 0.5);
scene.add(ambient);

// -------------------- Ground --------------------
const groundGeo = new THREE.PlaneGeometry(2000, 2000);
const groundMat = new THREE.MeshPhongMaterial({color:0x3a773a});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = 0;
scene.add(ground);

// -------------------- Glider --------------------
const planeGeo = new THREE.BoxGeometry(2,0.5,1);
const planeMat = new THREE.MeshStandardMaterial({color:0xffffff});
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.position.y = 2;
scene.add(plane);

// -------------------- Physics variables --------------------
let pos = new THREE.Vector3(0,2,0);
let vel = new THREE.Vector3(20,0,0);
let pitch = 0;      // rotatie rond z-as (hoogte)
let yaw = 0;        // rotatie rond y-as (richting)
let throttle = 0;    // 0..1

const mass = 300;
const g = 9.81;
const liftFactor = 0.25;
const dragFactor = 0.05;
const thrustPower = 50;

// Input
const keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// Helper
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// -------------------- Physics update --------------------
function updatePhysics(dt){
  dt = Math.min(0.05, dt);

  // --- controls ---
  const targetPitch = keys["ArrowUp"] ? -0.02 : keys["ArrowDown"] ? 0.02 : 0;
  pitch += targetPitch * dt * 60;
  pitch = clamp(pitch, -Math.PI/6, Math.PI/6);

  const targetThrottle = keys["ArrowRight"] ? 1 : keys["ArrowLeft"] ? 0 : throttle;
  throttle += (targetThrottle - throttle) * 0.02;

  // Forward vector based on yaw and pitch
  const forward = new THREE.Vector3(Math.sin(yaw), Math.sin(pitch), Math.cos(yaw)).normalize();

  const speed = vel.length();

  // Drag
  const drag = vel.clone().multiplyScalar(-dragFactor * speed);
  
  // Lift (perpendicular op forward vector, richting omhoog)
  let lift = new THREE.Vector3(0,0,0);
  if(speed > 1){
    const aoaEffect = clamp(Math.sin(pitch),0,0.6);
    lift.set(0,liftFactor*speed*speed*aoaEffect,0);
  }

  // Thrust
  const thrust = forward.clone().multiplyScalar(throttle * thrustPower);

  // Gewicht
  const weight = new THREE.Vector3(0, -mass*g, 0);

  // Som van krachten
  const acc = new THREE.Vector3();
  acc.add(drag).add(lift).add(thrust).add(weight).divideScalar(mass);

  // Integratie
  vel.add(acc.multiplyScalar(dt));
  pos.add(vel.clone().multiplyScalar(dt));

  // Grond collision
  if(pos.y < 0){
    pos.y = 0;
    if(vel.y < 0) vel.y = 0;
    vel.multiplyScalar(0.98);
  }

  // Update plane position & rotation
  plane.position.copy(pos);
  plane.rotation.x = pitch;
  plane.rotation.y = yaw;

  // Update HUD
  document.getElementById("hud").innerHTML =
    `Snelheid: ${Math.round(speed*3.6)} km/u<br>`+
    `Hoogte: ${Math.round(pos.y)} m<br>`+
    `Pitch: ${(pitch*180/Math.PI).toFixed(1)}° Throttle: ${Math.round(throttle*100)}%`;
}

// -------------------- Camera --------------------
function updateCamera(){
  camera.position.lerp(new THREE.Vector3(pos.x, pos.y+5, pos.z+10), 0.1);
  camera.lookAt(pos);
}

// -------------------- Main loop --------------------
let lastTime = null;
function loop(ts){
  if(!lastTime) lastTime = ts;
  const dt = (ts-lastTime)/1000;
  lastTime = ts;

  updatePhysics(dt);
  updateCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
