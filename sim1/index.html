<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>2D Glider Simulator - Teck (met startbaan)</title>
<link rel="stylesheet" href="/simLeren1/css/style.css"/> 
<style>
  body { margin: 0; overflow: hidden; background: #0d1b2a; }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    color: white;
    font-size: 16px;
    font-family: Arial;
    background: rgba(0,0,0,0.4);
    padding: 8px 10px;
    border-radius: 6px;
  }
</style>
</head>

<body>
<canvas id="sim"></canvas>
<div id="hud">Snelheid: 0 km/u<br>Hoogte: 0 m</div>

<script>
// -------------------- Canvas --------------------
const canvas = document.getElementById("sim");
const ctx = canvas.getContext("2d");
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener("resize", resize);

function updatePhysics(dt) {
  dt = Math.min(0.05, dt);

  // --- controls ---
  if (keys["ArrowUp"]) pitch -= 0.02;
  if (keys["ArrowDown"]) pitch += 0.02;
  if (keys["ArrowRight"]) throttle = Math.min(1, throttle + 0.01);
  if (keys["ArrowLeft"])  throttle = Math.max(0, throttle - 0.01);

  // snelheid & richting
  const speed = Math.sqrt(vx*vx + vy*vy);

  // --- Drag ---
  let dragX = -dragFactor * speed * vx;
  let dragY = -dragFactor * speed * vy;

  // --- Lift ---
  let liftX = 0, liftY = 0;
  if (speed > 0.1) {
    const velAngle = Math.atan2(vy, vx);
    const aoa = pitch - velAngle;
    const liftMag = liftFactor * speed * speed * Math.sin(aoa);
    const liftDir = velAngle + Math.PI/2;
    liftX = liftMag * Math.cos(liftDir);
    liftY = liftMag * Math.sin(liftDir);
  }

  // --- Thrust ---
  const thrustX = throttle * thrustPower * Math.cos(pitch);
  const thrustY = throttle * thrustPower * Math.sin(pitch);

  // --- Gravity ---
  const weightY = mass * g;

  // --- Som van krachten ---
  const fx = dragX + liftX + thrustX;
  const fy = dragY + liftY + thrustY - weightY;

  const ax = fx / mass;
  const ay = fy / mass;

  // update snelheid en positie
  vx += ax * dt;
  vy += ay * dt;
  x += vx * dt;
  y += vy * dt;

  // ground collision
  const groundY = canvas.height - 50;
  if (y > groundY) {
    y = groundY;
    if (vy > 0) vy = 0;
    vx *= 0.98;
  }

  // HUD
  document.getElementById("hud").innerHTML =
    `Snelheid: ${Math.round(speed*3.6)} km/u<br>` +
    `Hoogte: ${Math.round(groundY - y)} m<br>` +
    `Pitch: ${(pitch*180/Math.PI).toFixed(*


// -------------------- Main loop --------------------
let lastTime = null;
function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = (ts - lastTime) / 1000;
  lastTime = ts;

  updatePhysics(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
