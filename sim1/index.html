<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>2D Glider Simulator - Teck (realistisch, camera)</title>
<link rel="stylesheet" href="/simLeren1/css/style.css"/> 
<style>
  body { margin: 0; overflow: hidden; background: #0d1b2a; }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    color: white;
    font-size: 16px;
    font-family: Arial;
    background: rgba(0,0,0,0.4);
    padding: 8px 10px;
    border-radius: 6px;
  }
</style>
</head>

<body>
<canvas id="sim"></canvas>
<div id="hud">Snelheid: 0 km/u<br>Hoogte: 0 m</div>

<script>
// -------------------- Canvas --------------------
const canvas = document.getElementById("sim");
const ctx = canvas.getContext("2d");
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener("resize", resize);

// -------------------- Physics variables --------------------
let x = 200;
let y = canvas.height - 50; // start op grond
let vx = 20;  // startsnelheid
let vy = 0;
let pitch = 0;
let throttle = 0;

const mass = 300;
const g = 9.81;
const liftFactor = 0.25;
const dragFactor = 0.05;
const thrustPower = 50;

// inputs
const keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// helper
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// -------------------- Physics update --------------------
function updatePhysics(dt){
  dt = Math.min(0.05, dt);

  // controls
  if(keys["ArrowUp"]) pitch -= 0.02;
  if(keys["ArrowDown"]) pitch += 0.02;
  if(keys["ArrowRight"]) throttle = Math.min(1, throttle+0.01);
  if(keys["ArrowLeft"])  throttle = Math.max(0, throttle-0.01);

  // pitch limiter
  pitch = clamp(pitch, -Math.PI/3, Math.PI/3);

  const speed = Math.sqrt(vx*vx + vy*vy);

  // drag
  let dragX=0, dragY=0;
  if(speed>0.0001){
    const dragMag = dragFactor * speed*speed;
    dragX = dragMag * (-vx/speed);
    dragY = dragMag * (-vy/speed);
  }

  // lift
  let liftX=0, liftY=0;
  if(speed>0.0001){
    const velAngle = Math.atan2(vy,vx);
    const aoa = pitch - velAngle;
    const liftMag = liftFactor * speed*speed * clamp(Math.sin(aoa), 0, 0.8);
    const liftDir = velAngle + Math.PI/2;
    liftX = liftMag * Math.cos(liftDir);
    liftY = liftMag * Math.sin(liftDir);
  }

  // thrust
  const thrustX = throttle * thrustPower * Math.cos(pitch);
  const thrustY = throttle * thrustPower * Math.sin(pitch);

  // krachten
  const fx = dragX + liftX + thrustX;
  const fy = dragY + liftY + thrustY - mass*g;

  const ax = fx/mass;
  const ay = fy/mass;

  vx += ax*dt;
  vy += ay*dt;
  x += vx*dt;
  y += vy*dt;

  // grond
  const groundY = canvas.height - 50;
  if(y > groundY){
    y = groundY;
    if(vy>0) vy=0;
    vx *= 0.98; // wrijving
  }

  // HUD
  document.getElementById("hud").innerHTML =
    `Snelheid: ${Math.round(speed*3.6)} km/u<br>`+
    `Hoogte: ${Math.round(groundY - y)} m<br>`+
    `Pitch: ${(pitch*180/Math.PI).toFixed(1)}° Throttle: ${Math.round(throttle*100)}%`;
}

// -------------------- Draw --------------------
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // camera volgt het vliegtuig
  const camX = x - canvas.width/2;
  const camY = y - canvas.height/2;

  // achtergrond
  ctx.fillStyle="#0b1630";
  ctx.fillRect(camX, camY, canvas.width, canvas.height);

  // grond
  const groundYWorld = canvas.height - 50;
  ctx.fillStyle="#3a773a";
  ctx.fillRect(camX, groundYWorld, canvas.width, canvas.height-groundYWorld);

  // startbaan
  ctx.fillStyle="#555555";
  ctx.fillRect(50 - camX, groundYWorld+10, canvas.width-100, 15);
  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(50 - camX, groundYWorld+17.5);
  ctx.lineTo(canvas.width-50 - camX, groundYWorld+17.5);
  ctx.stroke();

  // vliegtuig in midden scherm
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.rotate(pitch);
  ctx.fillStyle="white";
  ctx.fillRect(-20,-5,40,10);
  ctx.fillRect(-10,-20,20,5);
  ctx.restore();

  // snelheid vector debug
  const speed = Math.sqrt(vx*vx + vy*vy);
  if(speed>0.1){
    ctx.beginPath();
    ctx.moveTo(canvas.width/2, canvas.height/2);
    ctx.lineTo(canvas.width/2 + (vx/speed)*60, canvas.height/2 + (vy/speed)*60);
    ctx.strokeStyle="rgba(255,255,0,0.8)";
    ctx.lineWidth=2;
    ctx.stroke();
  }
}

// -------------------- Main loop --------------------
let lastTime=null;
function loop(ts){
  if(!lastTime) lastTime=ts;
  const dt = (ts-lastTime)/1000;
  lastTime=ts;

  updatePhysics(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
